<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tạo QR - QuanLyTraiCay</title>
    <style>
      @media print {
        @page { size: A5 portrait; margin: 8mm; }
        body * { visibility: hidden; }
        #print-area, #print-area * { visibility: visible; }
        #print-area {
          position: absolute; left: 0; top: 0; width: 100%; height: 100%;
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          padding: 10mm; box-sizing: border-box;
        }
        #qrcode { width: 260px; height: 260px; margin-bottom: 15px; }
        #qtext { text-align: center; line-height: 1.5; font-size: 16px; font-weight: bold; }
      }

      body { font-family: Arial, sans-serif; background: #eef2f7; margin: 0; }
      header { background: #fff; padding: 12px 16px; border-bottom: 1px solid #ddd; position: relative; }
      .clock { position: absolute; right: 16px; top: 12px; background: #f7f9ff; padding: 8px 12px; border-radius: 6px; font-weight: 600; }
      .wrapper { display: flex; gap: 18px; padding: 18px; }
      .left { width: 520px; background: #fff; padding: 18px; border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,0.06); }
      .right { flex: 1; background: #fff; padding: 18px; border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,0.06); display:flex; flex-direction:column; align-items:center; justify-content:center; }
      
      .tabs { display: flex; margin-bottom: 15px; border-bottom: 2px solid #ddd; }
      .tab { padding: 12px 24px; cursor: pointer; font-weight: 600; }
      .tab.active { color: #0066ff; border-bottom: 3px solid #0066ff; }

      .form-row { display:flex; gap:12px; margin-bottom:12px; align-items:center; }
      label { width:110px; font-size:14px; }
      input[type=text], select, input[type=date] { flex:1; padding:8px 10px; border-radius:6px; border:1px solid #ccd0d8; }
      input[type=date]:disabled { background: #f0f0f0; color: #333; cursor: not-allowed; }

      .buttons { display:flex; gap:12px; margin-top:16px; }
      button { padding:10px 18px; border:none; border-radius:8px; cursor:pointer; background:#f0f0f0; }
      button.primary { background:#0066ff; color:#fff; }
      button.print-btn { background:#28a745; color:white; font-size:13px; padding:6px 14px; }
      button.export-btn { background:#17a2b8; color:white; }
      button.import-btn { background:#ffc107; color:black; }
      button.delete-all-btn { background:#dc3545; color:white; }

      #qrcode { width:320px; height:320px; display:flex; align-items:center; justify-content:center; border:1px dashed #ddd; background:white; }
      .history-list { max-height: 520px; overflow-y: auto; }
      .history-item { 
        padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
      }
      .history-item:hover { background: #f8f9ff; }
      .note { font-size:12px; color:#666; margin-top:8px; }
      .history-actions { margin: 10px 0; display: flex; gap: 8px; flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <header>
      <strong>Nhập Tạo QRcode</strong>
      <div id="realtimeClock" class="clock"></div>
    </header>

    <div class="wrapper">
      <div class="left">
        <div class="tabs">
          <div class="tab active" id="tab-create">Tạo QR</div>
          <div class="tab" id="tab-history">📋 Lịch sử</div>
        </div>

        <!-- Tab Tạo QR -->
        <div id="create-tab">
          <h3>Tạo QR Mới</h3>
          <div class="form-row">
            <label for="ttxe">TTxe</label>
            <select id="ttxe">
              <option value="">-- Chọn --</option>
              <option value="01">01</option><option value="02">02</option><option value="03">03</option>
              <option value="04">04</option><option value="05">05</option><option value="06">06</option>
              <option value="07">07</option><option value="08">08</option><option value="09">09</option>
              <option value="10">10</option><option value="11">11</option><option value="12">12</option>
              <option value="13">13</option><option value="14">14</option><option value="15">15</option>
              <option value="16">16</option><option value="17">17</option><option value="18">18</option>
              <option value="19">19</option><option value="20">20</option>
            </select>
          </div>

          <div class="form-row">
            <label for="ncc">NCC</label>
            <select id="ncc">
              <option value="009">009 - CTBT</option>
              <option value="010">010 - Nhà cung cấp B</option>
            </select>
            <label for="vitri1" style="width:90px;">Vị Trí Ú 1</label>
            <input id="vitri1" type="text" placeholder="Vị trí U1" style="width:140px">
          </div>

          <div class="form-row">
            <label for="noi">Nơi XS</label>
            <select id="noi">
              <option value="MT">MT - Miền Tây</option>
              <option value="BP">BP - Bình Phước</option>
              <option value="DN">DN - Đồng Nai</option>
            </select>
            <label for="vitri2" style="width:90px;">Vị Trí Ú 2</label>
            <input id="vitri2" type="text" placeholder="Vị trí U2" style="width:140px">
          </div>

          <div class="form-row">
            <label for="hang">Hàng</label>
            <select id="hang">
              <option value="D">D </option>
              <option value="R">R </option>
            </select>
            <label for="mui" style="width:90px;">Múi</label>
            <select id="mui" style="width:140px">
              <option value="0K">0K</option>
              <option value="0M">0M</option>
            </select>
          </div>

          <div class="form-row">
            <label for="ngay">Ngày Nhập</label>
            <input id="ngay" type="date" disabled>
          </div>

          <div class="buttons">
            <button id="clearBtn">Xoá</button>
            <button id="genBtn" class="primary">Tạo QR</button>
            <button id="printBtn">In</button>
          </div>
        </div>

        <!-- Tab Lịch sử -->
        <div id="history-tab" style="display:none;">
          <h3>Lịch sử QR Code</h3>
          
          <div class="history-actions">
            <button id="exportBtn" class="export-btn">📥 Tải lịch sử về (ZIP)</button>
            <button id="importBtn" class="import-btn">📤 Nhập lịch sử từ file</button>
            <button id="deleteAllBtn" class="delete-all-btn">🗑️ Xoá toàn bộ lịch sử</button>
          </div>

          <input type="text" id="searchHistory" placeholder="Tìm theo mã QR..." style="width:100%; padding:10px; margin-bottom:10px;">
          <div id="historyList" class="history-list"></div>
        </div>
      </div>

      <div class="right">
        <div id="print-area">
          <div id="qrcode">chờ tạo QR</div>
          <div id="qtext" class="note"></div>
        </div>
      </div>
    </div>

    <input type="file" id="importFile" accept=".json" style="display:none;">

    <!-- Thư viện cần thiết -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
      const clockEl = document.getElementById('realtimeClock');
      function pad(n){ return n < 10 ? '0' + n : n; }
      function updateClock() { 
        const d = new Date(); 
        clockEl.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); 
      }
      function setCurrentDate() { 
        document.getElementById('ngay').value = new Date().toISOString().split('T')[0]; 
      }

      updateClock(); 
      setCurrentDate(); 
      setInterval(updateClock, 1000);

      const qDiv = document.getElementById('qrcode');
      const qText = document.getElementById('qtext');
      let history = JSON.parse(localStorage.getItem('qrHistory')) || [];

      function saveToHistory(data) {
        history.unshift({ ...data, timestamp: new Date().toLocaleString('vi-VN') });
        if (history.length > 500) history.pop();
        localStorage.setItem('qrHistory', JSON.stringify(history));
        renderHistory();
      }

      function renderHistory(filtered = history) {
        const list = document.getElementById('historyList');
        list.innerHTML = filtered.map(item => `
          <div class="history-item" onclick="loadQRFromHistory(${JSON.stringify(item).replace(/"/g, '&quot;')})">
            <div>
              <strong>${item.ma_lo}</strong><br>
              <small>${item.timestamp}</small>
            </div>
            <button class="print-btn" onclick="event.stopImmediatePropagation(); printFromHistory('${item.ma_lo}', '${item.ngay_display}')">In</button>
          </div>
        `).join('');
      }

      window.loadQRFromHistory = function(item) {
        qDiv.innerHTML = '';
        new QRCode(qDiv, { text: item.ma_lo, width: 320, height: 320 });
        qText.innerHTML = `<div style="font-weight:600;">${item.ma_lo}</div><div>Ngày: ${item.ngay_display}</div>`;
      };

      window.printFromHistory = function(ma_lo, ngay) {
        qDiv.innerHTML = '';
        new QRCode(qDiv, { text: ma_lo, width: 320, height: 320 });
        qText.innerHTML = `<div style="font-weight:600;">${ma_lo}</div><div>Ngày: ${ngay}</div>`;
        setTimeout(() => window.print(), 300);
      };

      // Tab switching
      document.getElementById('tab-create').onclick = () => {
        document.getElementById('create-tab').style.display = 'block';
        document.getElementById('history-tab').style.display = 'none';
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-create').classList.add('active');
      };

      document.getElementById('tab-history').onclick = () => {
        document.getElementById('create-tab').style.display = 'none';
        document.getElementById('history-tab').style.display = 'block';
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-history').classList.add('active');
        renderHistory();
      };

      // Kiểm tra mật khẩu
      function checkPassword() {
        const password = prompt('Nhập mật khẩu để tải file ZIP:');
        if (password === null) return false;
        if (password === "CTYCT2026") return true;
        alert('❌ Mật khẩu sai!');
        return false;
      }

      // Export ra ZIP chứa JSON + Excel
      document.getElementById('exportBtn').addEventListener('click', async () => {
        if (history.length === 0) return alert('Lịch sử trống!');

        if (!checkPassword()) return;

        const dateStr = new Date().toISOString().slice(0,10);
        const zip = new JSZip();

        // 1. Tạo file JSON
        const jsonStr = JSON.stringify(history, null, 2);
        zip.file(`qr-history-${dateStr}.json`, jsonStr);

        // 2. Tạo file Excel
        const excelData = history.map(item => ({
          "Mã Lô": item.ma_lo,
          "Ngày Nhập": item.ngay_display,
          "Thời gian": item.timestamp,
          "TTxe": item.ttxe,
          "NCC": item.ncc,
          "Nơi XS": item.noi,
          "Hàng": item.hang,
          "Múi": item.mui,
          "Vị Trí 1": item.vitri1 || "",
          "Vị Trí 2": item.vitri2 || ""
        }));

        const ws = XLSX.utils.json_to_sheet(excelData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "LichSuQR");
        
        const excelBuffer = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
        zip.file(`qr-history-${dateStr}.xlsx`, excelBuffer);

        // Tạo và tải file ZIP
        const zipBlob = await zip.generateAsync({ type: "blob" });
        const url = URL.createObjectURL(zipBlob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `qr-history-${dateStr}.zip`;
        link.click();
        URL.revokeObjectURL(url);

        alert('✅ Đã tải file ZIP chứa JSON và Excel thành công!');
      });

      // Xoá toàn bộ lịch sử
      document.getElementById('deleteAllBtn').addEventListener('click', () => {
        if (history.length === 0) return alert('Lịch sử đã trống!');

        if (!checkPassword()) return;

        if (confirm('Bạn có chắc chắn muốn XOÁ TOÀN BỘ lịch sử? Hành động này không thể hoàn tác!')) {
          history = [];
          localStorage.removeItem('qrHistory');
          renderHistory();
          alert('✅ Đã xoá toàn bộ lịch sử thành công!');
        }
      });

      // Import JSON
      document.getElementById('importBtn').addEventListener('click', () => {
        document.getElementById('importFile').click();
      });

      document.getElementById('importFile').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(event) {
          try {
            const imported = JSON.parse(event.target.result);
            if (Array.isArray(imported)) {
              history = imported;
              localStorage.setItem('qrHistory', JSON.stringify(history));
              renderHistory();
              alert(`Đã nhập thành công ${history.length} bản ghi!`);
            } else {
              alert('File không đúng định dạng!');
            }
          } catch (err) {
            alert('Lỗi khi đọc file: ' + err.message);
          }
        };
        reader.readAsText(file);
      });

      // Tạo QR
      document.getElementById('genBtn').addEventListener('click', () => {
        const ttxe = document.getElementById('ttxe').value.trim();
        if (!ttxe) return alert('Vui lòng chọn TTxe!');

        const ncc = document.getElementById('ncc').value;
        const noi = document.getElementById('noi').value;
        const hang = document.getElementById('hang').value;
        const mui = document.getElementById('mui').value;
        const vitri1 = document.getElementById('vitri1').value.trim();
        const vitri2 = document.getElementById('vitri2').value.trim();

        const dateObj = new Date(document.getElementById('ngay').value);
        const dd = pad(dateObj.getDate());
        const mm = pad(dateObj.getMonth() + 1);
        const yy = String(dateObj.getFullYear());
        const ylast = yy.charAt(yy.length - 1);

        let posPart = '';
        if (vitri1 && vitri2) posPart = vitri1 + '/' + vitri2;
        else if (vitri1) posPart = vitri1;

        const ma_lo = hang + ncc + noi + dd + mm + ylast + '-' + ttxe + '-' + mui + (posPart ? '-' + posPart : '');

        qDiv.innerHTML = '';
        new QRCode(qDiv, { text: ma_lo, width: 320, height: 320 });

        const displayDate = dd + '/' + mm + '/' + yy;
        qText.innerHTML = `<div style="font-weight:600;">${ma_lo}</div><div>Ngày: ${displayDate}</div>`;

        saveToHistory({ ma_lo, ngay_display: displayDate, ttxe, ncc, noi, hang, mui, vitri1, vitri2 });
      });

      document.getElementById('printBtn').addEventListener('click', () => {
        if (qDiv.innerHTML.includes('chờ tạo QR')) return alert('Vui lòng tạo QR trước!');
        window.print();
      });

      document.getElementById('clearBtn').addEventListener('click', () => {
        document.getElementById('ttxe').value = '';
        document.getElementById('vitri1').value = '';
        document.getElementById('vitri2').value = '';
        setCurrentDate();
        document.getElementById('ncc').selectedIndex = 0;
        document.getElementById('noi').selectedIndex = 0;
        document.getElementById('hang').selectedIndex = 0;
        document.getElementById('mui').selectedIndex = 0;
        qDiv.innerHTML = 'chờ tạo QR';
        qText.textContent = '';
      });

      document.getElementById('searchHistory').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = history.filter(item => item.ma_lo.toLowerCase().includes(term));
        renderHistory(filtered);
      });

      renderHistory();
    </script>
  </body>
</html>
